Something painful that is rejected is perceived as a THREAT:
  if the mind is certain it can prevent it:
    🔴 Fight/Flight:

  if the mind is uncertain if it can prevent it:
    ⚪ Freeze:
      if the mind suspects it can be prevented using precision in action:
        - Obsessions & Compulsions
      if the mind suspects it can be prevented using search:
        - Anxiety
        - Panic
        - Nightmares
        - Hypnagogic & Hypnopompic Hallucinations and/or Imaginations

  if the mind is certain it cannot prevent it:
    😞 Depression:
      if the threat is extreme:
        ⚫ Shutdown (derealisation and/or depersonalisation):
          - Post-Traumatic Stress
      if the threat is social:
        - Loneliness
      if the threat is prolonged:
        - Self-harm
        - Suicide

Common threat patterns:
  individual patterns:
    - Darkness
    - Aloneness
    - Loud noises
    - Sudden changes
  social patterns:
    - Emotions of others:
        - anger
        - cry
        - widened eyes
    - Irregularity and oddness:
        - people with strange looks or behaviours irritate others' unconscious minds

Irrelevant brain diseases: # often dopamine related
  - Bipolar Disorder
  - Classic Autism
  - Delusional Disorder
  - Paranoia
  - Schizophrenia
  - Schizotypal Disorder
