Instinctive threat patterns raising alertness:
  General:
    - Oddness
    - Sudden changes
  Visual:
    - Darkness
    - Aloneness
  Auditory:
    - Loud noises
  Social:
    - Widened eyes
    - Anger
    - Cry

Notes:
  - if a Tribal threat hides itself behind a really life-or-death fear amplifying it (*thought camouflage*,
    complex anxiety), imagine and accept a scenario where the loss is unavoidable!
  - the brain induces adrenaline as much as the amount of change you're trying to create in the world,
    even if it's not quite disacceptance. Now if these changes you're trying to create go high, you'll get anxiety.
