Something painful that is rejected is perceived as a THREAT:
  if one has a satisfying option to deal with the threat:
    if the threat can be manipulated or could avoid doing that:
      🔴 Fight:
        if it is caused by another person:
          if they harm unconditionally:
            😡 Anger:
              - Anti-Social Personality Disorder
          if they can harm conditionally: # their superegos
            if the conditions are action-based:
              😠 Machiavellianism:
                - Obsessive-Compulsive Personality Disorder
            if the conditions are class-based:
              😎 Narcissism:
                - Narcissistic Personality Disorder
        if it is caused by oneself:
          😞 Depression:
            - Self-harm
            - Suicidality
            - Borderline Personality Disorder
    if one cannot manipulate the threat but can do something else:
      🔵 Flight:
        if the agents are people:
          if they harm unconditionally:
            🤨 Suspicion:
              - Paranoia
              - Paranoid Personality Disorder
          if they harm conditionally: # their superegos
            🙏 Fawn:
              if the conditions are action-based:
                😟 Obedience:
                  - Dependent Personality Disorder
              if the conditions are class-based:
                😇 Histrionicism:
                  - Histrionic Personality Disorder
              if the conditions cannot be met:
                ✋ Avoidance:
                  - Social Anxiety Disorder
                  - Avoidant Personality Disorder
          if they do not harm except by words: # that can be ignored
            😏 Recklessness:
              - Attention-Deficit Hyperactivity Disorder
        if the threats are certain life choices like habits or interests or paths:
          🤓 Perseverance:
            - Asperger's Syndrome  # Autism level 1
  if one is uncertain to choose what option to deal with the threat:
    ⚪ Freeze:
      if one has not made any decisions yet:
        - Generalized Anxiety Disorder
      if one is uncertain about the correctness of their decisions:
        - Obsessive-Compulsive Disorder
      if it is about death without any help:
        - Panic Disorder
      if it involves being killed by others:
        - Nightmares
        - Hypnagogic & Hypnopompic Hallucinations and/or Imaginations
  if one feels powerless to deal with the threat and the threat is too overwhelming:
    ⚫ Shutdown (derealisation and/or depersonalisation):
      - DPDR
      - PTSD  # adult traumas
      - Complex-PTSD  # childhood traumas
