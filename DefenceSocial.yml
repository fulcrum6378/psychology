Something painful experienced from others:

  # some people are genetically more reactive to social dangers;
  # they'll be diagnosed with personality disorders because they need to overuse social defences.
  # we call them neurotics here.

  if it is imperfection of one's worth:
    😎 Narcissism:
      - if neurotic:
          - narcissistic personality disorder
      - they are often a lot less dangerous than they sound!
      - they strongly activate social defences in everyone.

  if it is imperfection of one's actions:
    😠 Obsession & Compulsion:
      - if neurotic:
          if flight:
            obsessive-compulsive disorder
          if fawn:
            obsessive-compulsive personality disorder

  if it is novelty:
    🤓 Conservationism:
      - if neurotic:
          - Asperger's syndrome or autism spectrum disorder level 1

  if it others' annoying yet ignorable words:
    😏 Inattention & Hyperactivity:
      - if neurotic:
          - attention-deficit/hyperactivity disorder
      - often co-occurs with narcissism.

  if it is others' attention:
    ✋ Avoidance:
      - if neurotic:
          - social anxiety disorder
          - avoidant personality disorder  # NOT schizoid personality disorder

  if it is others' inattention:
    😇 Histrionicity:
      - if neurotic:
          - histrionic personality disorder

  if it is others' betrayal:
    😵 Paranoia:
      - if neurotic:
          - paranoid personality disorder

  if it is one's disobedience:
    😥 Dependence:
      - if neurotic:
          - dependent personality disorder

  if it is disloyalty:
    🔪 Worship:
      - if neurotic:
          - borderline personality disorder

  if it is trying to socialise: # learned helplessness
    👤 Isolation:
      - if neurotic:
          - schizoid personality disorder

  if it is people overall:
    👊 Anger:
      - if neurotic:
          - antisocial personality disorder
