Something painful experienced from others (especially parents) is regarded a TABOO:
  if it is disorder:
    😠 Obsessive-Compulsive Personality
  if it is humiliation:
    😎 Narcissism
  if it is attention by oneself:
    😏 Inattention & Hyperactivity
  if it is novelty:
    🤓 Asperger's Syndrome  # namely Autism level 1
  if it is rejection:
    🔪 Borderline Personality
  if it is disobedience:
    😥 Dependence
  if it is inattention:
    😇 Histrionicism
  if it is appearance:
    ✋ Avoidance
  if it is trust:
    😵 Paranoia
