Something painful experienced from others (especially parents) is regarded a TABOO:
  if it is imperfection of one's worth:
    😎 Narcissism  # fight=overt, flight=covert
  if it is imperfection of one's actions:
    😠 Obsessive-Compulsive Personality
  if it is novelty:
    🤓 Asperger's Syndrome  # namely Autism Spectrum level 1
  if it others' annoying yet ignorable words:
    😏 Inattention & Hyperactivity
  if it is others' attention:
    ✋ Avoidance  # social anxiety
  if it is others' inattention:
    😇 Histrionicity
  if it is others' betrayal:
    😵 Paranoia
  if it is one's disobedience:
    😥 Dependence
  if it is disloyalty:
    🔪 Borderline Personality
