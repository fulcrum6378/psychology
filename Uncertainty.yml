Uncertainty about something:
  if it is preceded by Pleasure:
    LOOK FOR THE AGENT responsible for the pleasure:
  if it is preceded by Pain:
    LOOK FOR THE AGENT responsible for the pain:
      if the agent is identified and controllable:
        🔴 Fight:
          if it is caused by another person:
            if they can harm conditionally:
              🙏 Fawn:
                if the conditions are class-based:
                  😎 Attention-Seeking: # and deceit
                    if they are less or equally powerful:
                      Narcissism:
                        - Narcissistic Personality Disorder
                    if they are more powerful:
                      Histrionicism:
                        - Histrionic Personality Disorder
                if the conditions are rule-based:
                   Obedience:
                    - Dependent Personality Disorder
            if they harm unconditionally:
              😠 Anger:
                if they are less powerful:
                  Anti-Sociality:
                    - Anti-Social Personality Disorder
                if they are more powerful:
                  Paranoia:
                    - Paranoid Personality Disorder
          if it is caused by oneself:
            😞 Depression:
              - Self-harm
              - Suicidality
              - Borderline Personality Disorder
      if the agent is identified but not uncontrollable:
        🔵 Flight:
          if the agents are people:
            if they harm unconditionally:
              ✋ Avoidance:
                - Social Anxiety Disorder
                - Avoidant Personality Disorder
            if they do not harm except by words:
              😏 Recklessness:
                - Attention-Deficit Hyperactivity Disorder
          if the agents are certain bad life conditions:
            🧐 Machiavellianism:
              - Obsessive-Compulsive Disorder
              - Obsessive-Compulsive Personality Disorder
          if the agent is the act of quitting any paths:
            🤓 Perseverance:
              - Asperger's Syndrome  # Autism level 1
      if the agent is unidentified (👻GHOST):
        ⚪ Freeze: # KEEP SCANNING
          if the problem is unsolved for long or unsolvable:
            - Nightmares
            - Hallucinations
            - Generalised Anxiety Disorder
            - Panic Disorder
      if one is or feels powerless:
        ⚫ Shutdown:
          - Short-lived derealisation or depersonalisation  # huge adult traumas
          - Complex-PTSD  # severe childhood traumas
