- !BEST!:
  depression: Determinism
  complex anxiety: Stoicism
  social anxiety: Desocialisation
  phobia: Exposure
  insomnia: Mindfulness

- Desocialisation of Superego:
    efficacy:
      anxiety: !PERFECT!
      depression: nice

- Determinism:
    premises:
      past: WAS = HAD TO BE
      future: WANT + CAN = WILL
    efficacy:
      anger: none
      anxiety: nice if it's about self not others
      depression: !PERFECT!

- Stoicism:
    efficacy:
      anger: none
      anxiety:
        merely egoistic: unapplicable
        merely social: nice
        egoistic+social: !PERFECT!

- Exposure:
    efficacy:
      anxiety: nice
      depression: negative
      phobia: !PERFECT!
    methods:
      - Gradual exposure
      - EMDR
      - Flooding

- Mindfulness:
  efficacy:
    anger: nice
    anxiety: nice
    depression: negative
    insomnia: great

- Meditation:
  efficacy:
    anxiety: little, sometimes negative

- Stress Management:
  efficacy:
    anger: great
    anxiety: fragile, sometimes negative
  methods:
    - Deep breath
    - Muscle relaxation
